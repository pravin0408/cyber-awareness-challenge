<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CyberArena | 3D Real-Time Cybersecurity Threat Defense</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 3D WebGL Background Canvas -->
  <canvas id="cyber-3d-canvas"></canvas>

  <!-- Cyber Scanline and Ambient Lighting Overlay -->
  <div class="cyber-scanlines"></div>
  <div class="cyber-bg-glow"></div>

  <!-- Top 3D HUD Telemetry Bar -->
  <div class="hud-top-bar">
    <div class="hud-left">
      <span class="hud-pulse-dot"></span>
      <span class="hud-sys-status">SYS.NODE // ONLINE</span>
    </div>
    <div class="hud-right">
      <button class="hud-3d-toggle" id="btn-toggle-3d" title="Toggle 3D WebGL Engine">
        <span class="hud-3d-icon">&#x2B22;</span>
        <span id="hud-3d-label">3D CORE // ACTIVE</span>
      </button>
    </div>
  </div>

  <!-- Mount point for SPA views -->
  <div id="app"></div>

  <!-- Three.js WebGL Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Dynamic Universal Script Loader -->
  <script>
    (function () {
      const isLocalPublic =
        window.location.pathname.includes("/public/") ||
        window.location.pathname.endsWith("/public");
      const prefix = isLocalPublic ? "../src/" : "./src/";
      const scripts = [
        "questions.js",
        "scoring.js",
        "proctor.js",
        "mockBackend.js",
        "threeScene.js",
        "app.js",
      ];
      scripts.forEach(function (s) {
        document.write('<script src="' + prefix + s + '"><\/script>');
      });
    })();
  </script>
</body>
</html>

name: Validate and Push Code

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality & Tests
        run: |
          npm run lint || echo "Linting warnings found, continuing..."
          npm run test:ci

      - name: Auto-Commit Formatting Fixes (if PR)
        if: github.event_name == 'pull_request'
        run: |
          npm run lint:fix || true
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-fix code formatting" && git push)
